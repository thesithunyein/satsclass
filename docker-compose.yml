# SatsClass local stack: Bitcoin Core (regtest) + LND + seed/miner + web app.
# Start everything with:  docker compose up --build
services:
  bitcoind:
    image: bitcoin/bitcoin:29
    entrypoint: ["bitcoind"]
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -datadir=/data
      - -printtoconsole=1
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -rpcuser=${BTC_RPC_USER}
      - -rpcpassword=${BTC_RPC_PASS}
      - -fallbackfee=0.0002
      - -zmqpubrawblock=tcp://0.0.0.0:28332
      - -zmqpubrawtx=tcp://0.0.0.0:28333
    volumes:
      - bitcoind-data:/data
    healthcheck:
      test: ["CMD", "bitcoin-cli", "-regtest", "-datadir=/data", "-rpcuser=${BTC_RPC_USER}", "-rpcpassword=${BTC_RPC_PASS}", "getblockchaininfo"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the class faucet wallet, mines 101 blocks so it has spendable coins,
  # then mines one block every BLOCK_INTERVAL seconds so learners see confirmations.
  seed:
    image: bitcoin/bitcoin:29
    entrypoint: ["sh", "/scripts/seed.sh"]
    environment:
      BTC_RPC_USER: ${BTC_RPC_USER}
      BTC_RPC_PASS: ${BTC_RPC_PASS}
      BLOCK_INTERVAL: ${BLOCK_INTERVAL:-10}
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      bitcoind:
        condition: service_healthy
    restart: unless-stopped

  # Class Lightning node: holds learners' practice Lightning balances and pays invoices.
  lnd:
    image: lightninglabs/lnd:v0.21.8-beta
    command:
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=${BTC_RPC_USER}
      - --bitcoind.rpcpass=${BTC_RPC_PASS}
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --noseedbackup
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --tlsextradomain=lnd
      - --listen=0.0.0.0:9735
      - --alias=satsclass-class-node
    volumes:
      - lnd-data:/root/.lnd
    depends_on:
      bitcoind:
        condition: service_healthy
    restart: unless-stopped

  # The shop's Lightning node. The class node opens a channel to it on first use,
  # so learners can pay a real Lightning invoice (mission 4).
  lnd-shop:
    image: lightninglabs/lnd:v0.21.8-beta
    command:
      - --bitcoin.regtest
      - --bitcoin.node=bitcoind
      - --bitcoind.rpchost=bitcoind:18443
      - --bitcoind.rpcuser=${BTC_RPC_USER}
      - --bitcoind.rpcpass=${BTC_RPC_PASS}
      - --bitcoind.zmqpubrawblock=tcp://bitcoind:28332
      - --bitcoind.zmqpubrawtx=tcp://bitcoind:28333
      - --noseedbackup
      - --rpclisten=0.0.0.0:10009
      - --restlisten=0.0.0.0:8080
      - --listen=0.0.0.0:9735
      - --tlsextradomain=lnd-shop
      - --alias=satsclass-shop
    volumes:
      - lnd-shop-data:/root/.lnd
    depends_on:
      bitcoind:
        condition: service_healthy
    restart: unless-stopped

  app:
    build: ./app
    # Runs as root locally so it can read the LND macaroons (owned by root, mode 600) from the shared volumes.
    user: "0:0"
    environment:
      CHAIN_BACKEND: core
      BTC_NETWORK: regtest
      BTC_RPC_URL: http://bitcoind:18443
      BTC_RPC_USER: ${BTC_RPC_USER}
      BTC_RPC_PASS: ${BTC_RPC_PASS}
      FAUCET_WALLET: faucet
      FAUCET_AMOUNT_BTC: ${FAUCET_AMOUNT_BTC:-0.001}
      LND_REST_URL: https://lnd:8080
      LND_TLS_CERT_PATH: /lnd/tls.cert
      LND_MACAROON_PATH: /lnd/data/chain/bitcoin/regtest/admin.macaroon
      SHOP_LND_REST_URL: https://lnd-shop:8080
      SHOP_LND_TLS_CERT_PATH: /lnd-shop/tls.cert
      # Least privilege: read-only for getinfo, invoice-only for creating invoices.
      SHOP_LND_MACAROON_PATH: /lnd-shop/data/chain/bitcoin/regtest/readonly.macaroon
      SHOP_LND_INVOICE_MACAROON_PATH: /lnd-shop/data/chain/bitcoin/regtest/invoice.macaroon
      SHOP_LND_P2P_HOST: lnd-shop:9735
    volumes:
      - lnd-data:/lnd:ro
      - lnd-shop-data:/lnd-shop:ro
    ports:
      - "3000:3000"
    depends_on:
      bitcoind:
        condition: service_healthy
      lnd:
        condition: service_started
      lnd-shop:
        condition: service_started

volumes:
  bitcoind-data:
  lnd-data:
  lnd-shop-data:
